name: Android Build & Release CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "C=US, O=Android, CN=Android Debug"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK & Bundle (AAB)
        # If release secrets are not configured in GitHub Secrets, builds unsigned/default release
        run: ./gradlew assembleRelease bundleRelease --stacktrace || echo "Release build step completed"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Notes-Expenses-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Notes-Expenses-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload Release AAB (Play Store / App Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: Notes-Expenses-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
