name: Android Automated Build & Release Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-sign:
    name: Build, Sign & Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🐘 Set up Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: ⚙️ Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: 🔑 Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: 🔐 Prepare Signing Keystore
        id: setup-keystore
        run: |
          mkdir -p keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore/release.keystore
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/keystore/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          elif [ -f "keystore/release.keystore" ]; then
            echo "Using committed release.keystore from repository..."
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/keystore/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=NoteLedgerKey2026!" >> $GITHUB_ENV
            echo "KEY_ALIAS=noteledger" >> $GITHUB_ENV
            echo "KEY_PASSWORD=NoteLedgerKey2026!" >> $GITHUB_ENV
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "Generating production release keystore..."
            keytool -genkey -v \
              -keystore keystore/release.keystore \
              -alias noteledger \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass NoteLedgerKey2026! \
              -keypass NoteLedgerKey2026! \
              -dname "CN=NoteLedger, OU=Mobile, O=NoteLedgerApp, L=Global, ST=Mobile, C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/keystore/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=NoteLedgerKey2026!" >> $GITHUB_ENV
            echo "KEY_ALIAS=noteledger" >> $GITHUB_ENV
            echo "KEY_PASSWORD=NoteLedgerKey2026!" >> $GITHUB_ENV
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          fi

      - name: 🧪 Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: 📦 Compile Release APK (assembleRelease)
        run: ./gradlew assembleRelease --stacktrace

      - name: 📦 Compile Release Android App Bundle (bundleRelease)
        run: ./gradlew bundleRelease --stacktrace

      - name: 🔏 Sign and Align Production Artifacts (apksigner v2/v3)
        run: |
          echo "Locating build tools and apksigner..."
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
          
          APK_RAW=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_RAW" ]; then
            echo "Processing APK: $APK_RAW"
            
            # Align APK if not already aligned
            $ZIPALIGN -f -p 4 "$APK_RAW" /tmp/aligned.apk || cp "$APK_RAW" /tmp/aligned.apk
            
            # Sign with apksigner (V1, V2, and V3 signatures)
            $APKSIGNER sign --ks "$KEYSTORE_PATH" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out app/build/outputs/apk/release/app-release-signed.apk /tmp/aligned.apk
              
            echo "Verifying apksigner output:"
            $APKSIGNER verify --verbose app/build/outputs/apk/release/app-release-signed.apk
          fi

      - name: 🗂️ Collect Artifacts
        run: |
          mkdir -p release-artifacts
          # Copy Signed Release APK
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk release-artifacts/NoteLedger-v2.00-release-signed.apk
          else
            find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-artifacts/NoteLedger-v2.00-release-signed.apk \; || true
          fi
          # Copy Release AAB (Google Play Store Bundle)
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} release-artifacts/NoteLedger-v2.00-release.aab \; || true
          ls -lh release-artifacts/

      - name: 📤 Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NoteLedger-Signed-APK
          path: release-artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 📤 Upload Release AAB (Google Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: NoteLedger-Release-AAB
          path: release-artifacts/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: 📊 Upload Test & Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
