name: Build Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Keystore ডিকোড করা
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      # পারমিশন দিয়ে শুধু রিলিজ বিল্ড চালানো
      - name: Build Release APK and Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      # apksigner দিয়ে নিশ্চিত সাইন করা
      - name: Sign APK manually
        run: |
          APK_RAW=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK to sign: $APK_RAW"
          $ANDROID_HOME/build-tools/34.0.0/zipalign -f -v -p 4 "$APK_RAW" app-release-aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks app/release.keystore --ks-key-alias "${{ secrets.KEY_ALIAS }}" --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" --key-pass pass:"${{ secrets.KEY_PASSWORD }}" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out app-final-release.apk app-release-aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose app-final-release.apk

      # শুধু সাইন করা রিলিজ ফাইল আপলোড
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Production-Release-APK
          path: app-final-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Production-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
