name: Android Automated Build & Release Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-sign:
    name: Build & Release Signed Production Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🐘 Set up Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: ⚙️ Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: 🔑 Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: 🔐 Decode Keystore
        run: |
          mkdir -p app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
          elif [ -f "keystore/release.keystore" ]; then
            cp keystore/release.keystore app/release.keystore
          fi

      - name: 🧪 Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: 📦 Build Release APK and AAB
        env:
          KEYSTORE_PATH: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: 📤 Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NoteLedger-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: 📤 Upload Release AAB (Google Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: NoteLedger-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: 📊 Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
